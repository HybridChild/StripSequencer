# Every phase ends green, and this is what says so.
#
# Two axes only. The variants are *not* a matrix axis: one configure produces
# all five libraries and all five test binaries in the same tree, and
# doctest_discover_tests registers every case under its variant's prefix, so a
# matrix over variants would rebuild everything five times for the same
# coverage and the same per-variant reporting.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # No doctest package is installed on the runner, so this exercises the
      # FetchContent fallback in CMakeLists.txt -- the path a developer with
      # doctest installed never takes.
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      # Five variants x every case, each reported under its own name.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j

  cross:
    name: freestanding cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi

      # The library only: no tests, no link. Compiling for a Cortex-M4 and a
      # Cortex-M0 with no hosted libc and Zephyr's two C++ headers, then checking
      # each object's undefined symbols against an allowlist, is the signal --
      # see cmake/arm-none-eabi.cmake and the script.
      - name: Cross-compile the library
        run: ./scripts/cross-check.sh

      - name: Check the archive exists
        run: arm-none-eabi-nm build-cross/libstripseq.a

  zephyr:
    name: zephyr module and sample
    runs-on: ubuntu-latest
    env:
      ZEPHYR_WORKSPACE: ${{ github.workspace }}/../zephyr-ws
      # Named rather than registered: west sdk install registers the SDK in
      # ~/.cmake, which a cache restore does not bring back.
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../zephyr-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build device-tree-compiler
          pip install west

      # The version the bench workspace runs, and only the two modules the
      # sample's build reads -- hal_stm32 and cmsis_6. A build against the
      # whole manifest gives the same image, byte for byte, for ten times the
      # download.
      - name: Cache the workspace and SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ZEPHYR_WORKSPACE }}
            ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: zephyr-v4.4.1-hal_stm32-cmsis_6-sdk-arm

      - name: Set up the workspace
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.1 \
                    -o=--depth=1 "$ZEPHYR_WORKSPACE"
          cd "$ZEPHYR_WORKSPACE"
          west config manifest.project-filter -- '-.*,+cmsis_6,+hal_stm32'
          west update --narrow -o=--depth=1
          west sdk install -t arm-zephyr-eabi -H -d "$ZEPHYR_SDK_INSTALL_DIR"

      - name: Install Zephyr's Python requirements
        run: pip install -r "$ZEPHYR_WORKSPACE/zephyr/scripts/requirements-base.txt"

      # Both settings, because they take different code paths in the adapter:
      # update_channels() and a permute, or update_rgb() and a straight cast.
      - name: Build the sample, RGBW
        run: ./scripts/sample-build.sh -p

      - name: Build the sample, RGB
        run: ./scripts/sample-build.sh -p --rgb

      # One configuration is enough: frame_cost has no adapter, so the channel
      # setting takes no path of its own here that strip_demo does not cover.
      - name: Build frame_cost
        run: SAMPLE=frame_cost ./scripts/sample-build.sh -p
