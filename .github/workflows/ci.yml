# Every phase ends green, and this is what says so.
#
# Two axes only. The variants are *not* a matrix axis: one configure produces
# all five libraries and all five test binaries in the same tree, and
# doctest_discover_tests registers every case under its variant's prefix, so a
# matrix over variants would rebuild everything five times for the same
# coverage and the same per-variant reporting.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # No doctest package is installed on the runner, so this exercises the
      # FetchContent fallback in CMakeLists.txt -- the path a developer with
      # doctest installed never takes.
      #
      # Warnings are errors here and only here: a warning in a green build
      # scrolls past unread, but one mid-edit at a desk should not stop the
      # build. CMAKE_COMPILE_WARNING_AS_ERROR is CMake's own switch for this,
      # so it reaches every target without the project naming a flag.
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      # Five variants x every case, each reported under its own name.
      - name: Test
        run: ctest --test-dir build --output-on-failure -j

  # The host suite again, instrumented. UBSan is the one that matters: the
  # stagger's signed arithmetic, a shift standing in for a divide, and the
  # remainder of a negative playhead are all code that is correct only while it
  # stays defined, and a test that passes on undefined behaviour proves nothing
  # about the next compiler. ASan rides along for the cost of a flag.
  sanitizers:
    name: sanitizers (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Given on the command line, never written into CMakeLists.txt: the
      # library sets no toolchain flag, and a sanitizer is a property of this
      # build, not of the project. CMAKE_CXX_FLAGS reaches the link line too,
      # which is what pulls in the runtimes.
      #
      # -fno-sanitize-recover=all is what makes a report a failure. Without it
      # UBSan prints, carries on, and the test passes; with it the process
      # aborts and the case fails. ASan aborts on its own.
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >
          cmake -S . -B build -G Ninja
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build

      # A run with no reports is also what an uninstrumented build looks like,
      # so check the instrumentation is there before trusting the silence. The
      # _abort spelling is the one -fno-sanitize-recover selects, so it proves
      # both flags arrived.
      - name: Check every variant is instrumented
        run: |
          for lib in build/libstripseq_*.a; do
            grep -q __asan_init <(nm "$lib") || { echo "$lib: no ASan"; exit 1; }
            grep -q '__ubsan_handle_.*_abort' <(nm "$lib") || { echo "$lib: no UBSan"; exit 1; }
          done

      - name: Test
        run: ctest --test-dir build --output-on-failure -j

  cross:
    name: freestanding cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi

      # The library only: no tests, no link. Compiling for a Cortex-M4 and a
      # Cortex-M0 with no hosted libc and Zephyr's two C++ headers, then checking
      # each object's undefined symbols against an allowlist and its sections
      # and symbols for run-time initialisation, is the signal -- see
      # cmake/arm-none-eabi.cmake and the script.
      - name: Cross-compile the library
        run: ./scripts/cross-check.sh

      - name: Check the archive exists
        run: arm-none-eabi-nm build-cross/libstripseq.a

  zephyr:
    name: zephyr module and sample
    runs-on: ubuntu-latest
    env:
      ZEPHYR_WORKSPACE: ${{ github.workspace }}/../zephyr-ws
      # Named rather than registered: west sdk install registers the SDK in
      # ~/.cmake, which a cache restore does not bring back.
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../zephyr-sdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install host tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build device-tree-compiler
          pip install west

      # The version the bench workspace runs, and only the two modules the
      # sample's build reads -- hal_stm32 and cmsis_6. A build against the
      # whole manifest gives the same image, byte for byte, for ten times the
      # download.
      - name: Cache the workspace and SDK
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ZEPHYR_WORKSPACE }}
            ${{ env.ZEPHYR_SDK_INSTALL_DIR }}
          key: zephyr-v4.4.1-hal_stm32-cmsis_6-sdk-arm

      - name: Set up the workspace
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.1 \
                    -o=--depth=1 "$ZEPHYR_WORKSPACE"
          cd "$ZEPHYR_WORKSPACE"
          west config manifest.project-filter -- '-.*,+cmsis_6,+hal_stm32'
          west update --narrow -o=--depth=1

      - name: Install Zephyr's Python requirements
        run: pip install -r "$ZEPHYR_WORKSPACE/zephyr/scripts/requirements-base.txt"

      # After the requirements, not with the workspace: west sdk is one of
      # Zephyr's own extension commands, and imports what they list.
      - name: Install the SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$ZEPHYR_WORKSPACE"
          west sdk install -t arm-zephyr-eabi -H -d "$ZEPHYR_SDK_INSTALL_DIR"

      # Both settings, because they take different code paths in the adapter:
      # update_channels() and a permute, or update_rgb() and a straight cast.
      - name: Build the sample, RGBW
        run: ./scripts/sample-build.sh -p

      - name: Build the sample, RGB
        run: ./scripts/sample-build.sh -p --rgb

      # One configuration is enough: frame_cost has no adapter, so the channel
      # setting takes no path of its own here that strip_demo does not cover.
      - name: Build frame_cost
        run: SAMPLE=frame_cost ./scripts/sample-build.sh -p

      # One configuration is enough: the adapter's two paths are strip_demo's
      # builds above, and nothing else here depends on the channel setting.
      - name: Build showcase
        run: SAMPLE=showcase ./scripts/sample-build.sh -p
