# C++20 is the library's one requirement, and CONFIG_STRIPSEQ depends on it
# rather than selecting it: the standard is the application's choice. The C++
# library stays Zephyr's default minimal one, which is all the core includes.
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# The library. The bench strip is RGBW, so the white channel is on -- not the
# library's default. scripts/sample-build.sh --rgb turns it off on the command
# line, which builds the led_strip_update_rgb() path against the same board.
CONFIG_STRIPSEQ=y
CONFIG_STRIPSEQ_WHITE_CHANNEL=y

# The driver. WS2812_STRIP_I2S is default-y once the devicetree node exists,
# and it selects I2S; I2S_STM32 in turn selects DMA and, on this cache-equipped
# M7, CACHE_MANAGEMENT -- the driver flushes the D-cache over each block before
# the DMA reads it, so the slab can live in ordinary cached SRAM.
CONFIG_LED_STRIP=y

# The user button that advances the bring-up stages.
CONFIG_GPIO=y
