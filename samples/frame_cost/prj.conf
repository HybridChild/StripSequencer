# The library, as strip_demo builds it. The white channel follows the bench
# strip; scripts/sample-build.sh --rgb turns it off on the command line.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_STRIPSEQ=y
CONFIG_STRIPSEQ_WHITE_CHANNEL=y

# The timing API, which on a Cortex-M with a DWT unit -- the M7 has one --
# reads its cycle counter. It selects CORTEX_M_DWT itself.
CONFIG_TIMING_FUNCTIONS=y

# No LED strip, no button: render() writes a buffer that is never sent, so the
# figures are the library's alone. The board's default devicetree is enough,
# and the optimisation level is Zephyr's default, -Os, as for any application.
