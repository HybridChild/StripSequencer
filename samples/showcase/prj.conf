# The library, as strip_demo builds it. The white channel follows the bench
# strip; scripts/sample-build.sh --rgb turns it off on the command line.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_STRIPSEQ=y
CONFIG_STRIPSEQ_WHITE_CHANNEL=y

# The driver, which the devicetree node enables; see strip_demo's prj.conf for
# what it selects on this board.
CONFIG_LED_STRIP=y

# The user button that advances to the next animation.
CONFIG_GPIO=y
