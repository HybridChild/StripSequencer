# What twister builds of this sample; see strip_demo's sample.yaml for how it is
# run and why it only builds.
#
# One channel configuration, for the showcase's reason: the only other thing
# the setting changes here is one constant stop in each palette.
sample:
  name: flame
  description: A whole fire drawn by a replaced step 2, with no heat array
common:
  build_only: true
  tags: stripseq
  # The bench board alone. What this sample adds to the matrix is its own
  # code, which uses more of the library's API than strip_demo does; its other
  # boards' overlays only include strip_demo's, which strip_demo's builds
  # already check.
  platform_allow:
    - nucleo_h753zi
  integration_platforms:
    - nucleo_h753zi
tests:
  sample.stripseq.flame: {}
